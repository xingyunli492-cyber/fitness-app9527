<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}健身热量管理{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 顶部标题栏 -->
    <header class="app-header">
        <span class="header-title">{% block header %}健身热量管理{% endblock %}</span>
    </header>

    <!-- 主内容区 -->
    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <!-- 底部 Tab 导航栏 -->
    <nav class="tab-bar">
        <a href="{{ url_for('index') }}" class="tab {{ 'active' if request.endpoint == 'index' }}">
            <span class="tab-icon">📊</span>
            <span class="tab-label">仪表盘</span>
        </a>
        <a href="{{ url_for('diet') }}" class="tab {{ 'active' if request.endpoint == 'diet' }}">
            <span class="tab-icon">🍚</span>
            <span class="tab-label">饮食</span>
        </a>
        <a href="{{ url_for('exercise') }}" class="tab {{ 'active' if request.endpoint == 'exercise' }}">
            <span class="tab-icon">🏃</span>
            <span class="tab-label">运动</span>
        </a>
        <a href="{{ url_for('recommend') }}" class="tab {{ 'active' if request.endpoint == 'recommend' }}">
            <span class="tab-icon">💡</span>
            <span class="tab-label">推荐</span>
        </a>
        <a href="{{ url_for('profile') }}" class="tab {{ 'active' if request.endpoint == 'profile' }}">
            <span class="tab-icon">👤</span>
            <span class="tab-label">我的</span>
        </a>
    </nav>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
